<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Green Cafe serves freshly brewed coffee, tea and sandwiches in a cozy setting. View our menu and visit us today.">
  <meta name="keywords" content="cafe, coffee, tea, sandwiches, green cafe">
  <meta name="author" content="Green Cafe">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.example.com/">

  <!-- Open Graph tags for social sharing -->
  <meta property="og:title" content="Green Cafe | Fresh Coffee, Tea &amp; Sandwiches">
  <meta property="og:description" content="Freshly brewed coffee and snacks in a cozy setting.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.example.com/cafe.jpg">

  <style>
    body { font-family: Arial, sans-serif; margin: 0; line-height: 1.6; }
    header, main, footer { max-width: 800px; margin: auto; padding: 16px; }
    nav a { margin-right: 14px; }
    img { max-width: 100%; height: auto; }
    a { color: #0b5cad; }                 /* good contrast for accessibility */
    .skip { position: absolute; left: -999px; }
    .skip:focus { left: 8px; top: 8px; background: #fff; padding: 6px; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <header>
    <h1>Green Cafe</h1>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="#menu">Menu</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="main">
    <section>
      <h2>Welcome</h2>
      <img src="cafe.jpg" alt="Cozy interior of Green Cafe with wooden tables and plants" width="800" height="450">
      <p>We serve fresh coffee and snacks every day from 8 AM to 10 PM.</p>
    </section>

    <section id="menu">
      <h2>Our Menu</h2>
      <ul>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Sandwiches</li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact Us</h2>
      <address>12 Park Street, Noida, India</address>
      <label for="email">Your email</label>
      <input type="email" id="email" name="email">
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Green Cafe</p>
  </footer>
</body>
</html>
